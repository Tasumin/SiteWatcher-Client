services:
  sitewatch-agent:
    build: .
    container_name: sitewatch-agent
    restart: unless-stopped
    environment:
      SITEWATCH_SERVER_URL: ${SITEWATCH_SERVER_URL}
      SITEWATCH_AGENT_TOKEN: ${SITEWATCH_AGENT_TOKEN}
      SITEWATCH_DB: /data/queue.db
      SITEWATCH_DISCOVERY_CIDRS: ${SITEWATCH_DISCOVERY_CIDRS:-}
      SITEWATCH_DISCOVERY_CIDR: ${SITEWATCH_DISCOVERY_CIDR:-}
      SITEWATCH_DISCOVERY_INTERVAL_SECONDS: ${SITEWATCH_DISCOVERY_INTERVAL_SECONDS:-900}
      SITEWATCH_SNAPSHOT_INTERVAL_SECONDS: ${SITEWATCH_SNAPSHOT_INTERVAL_SECONDS:-300}
    volumes:
      - sitewatch_data:/data

volumes:
  sitewatch_data:
